  <dialog x-data="threadDelete" id="delete-thread-dialog" class="custom-modal" x-cloak x-on:cancel.prevent="threadDelete.closeThreadDelete()" x-on:click="if ($event.target === $el) threadDelete.closeThreadDelete()">
    <section class="notice-card delete-confirmation" role="alertdialog" aria-labelledby="delete-thread-title">
      <h2 id="delete-thread-title">Delete thread?</h2>
      <p>This removes "<span x-text="threadDelete.threadDeleteCandidate?.title"></span>" and all its replies for everyone, along with its link in the channel or DM it started in. You can't undo this.</p>
      <p class="profile-error" role="alert" x-show="threadDelete.threadDeleteError" x-text="threadDelete.threadDeleteError"></p>
      <div class="pair-actions">
        <button type="button" class="btn-secondary" autofocus :disabled="threadDelete.threadDeleteBusy" x-on:click="threadDelete.closeThreadDelete()">Cancel</button>
        <button type="button" class="btn-danger" :disabled="threadDelete.threadDeleteBusy" x-on:click="threadDelete.deleteThread()" x-text="threadDelete.threadDeleteBusy ? 'Deleting…' : 'Delete thread'"></button>
      </div>
    </section>
  </dialog>
