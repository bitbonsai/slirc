<a x-show="segment.href" class="message-link" :href="segment.href" :data-tooltip="segment.href" x-tooltip target="_blank" rel="noopener noreferrer" x-on:click="if (segment.route) { $event.preventDefault(); openMessageLink(segment.href) }" x-on:contextmenu="if (!segment.route) { $event.preventDefault(); links.openLinkPopup($el, message, segment) }" x-on:touchstart.passive="if (!segment.route) { $event.stopPropagation(); actions.pressStart($event, message, () => links.openLinkPopup($el, message, segment)) }" x-text="segment.text"></a><strong x-show="segment.format === 'strong'" x-text="segment.text"></strong><em x-show="segment.format === 'em'" x-text="segment.text"></em><code x-show="segment.format === 'code'" x-text="segment.text"></code><pre x-show="segment.format === 'fence'" class="fence" x-html="fenceHtml(segment)"></pre><span class="mention" :class="mentionAgent(segment.nick) && 'agent-mention'" x-show="segment.nick" role="button" tabindex="0" :aria-label="mentionAgent(segment.nick) ? mentionAgent(segment.nick).name + ', @' + segment.nick : null" :data-tooltip="mentionAgent(segment.nick) ? '@' + segment.nick : null" x-tooltip x-on:click.stop="people.openWhois(segment.nick)" x-on:keydown.enter.prevent="people.openWhois(segment.nick)" x-on:keydown.space.prevent="people.openWhois(segment.nick)"><template x-if="mentionAgent(segment.nick)"><img class="agent-mention-mark" :src="mentionAgent(segment.nick).icon" alt="" /></template><span x-text="mentionAgent(segment.nick)?.name ?? segment.text"></span></span><template x-if="segment.emojiUrl"><img class="custom-emoji" :src="segment.emojiUrl" :alt="segment.text" :data-tooltip="segment.text" x-tooltip /></template><blockquote x-show="segment.quote" x-text="segment.text"></blockquote><span x-show="!segment.href && !segment.nick && !segment.format && !segment.emojiUrl && !segment.quote && !segment.marker" x-text="segment.text"></span>
