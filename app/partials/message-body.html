<span class="body"><button x-show="replyThreadBroadcastParent(message)" type="button" class="reply-broadcast-note" x-on:click.stop="openReplyThread(replyThreadBroadcastParent(message))"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('corner-down-right')"></span><span x-text="'Also replied to ' + (replyThreadBroadcastParent(message)?.authorNick || '') + '\'s thread'"></span></button><span class="message-copy"><span class="body-seg"><template x-for="(segment, n) in textSegments(messageText(message))" :key="n"><span><!-- include: message-segment --><template x-if="segment.marker"><span class="list-item"><span class="list-marker" aria-hidden="true" x-text="segment.marker"></span><span class="list-text"><template x-for="(segment, p) in segment.parts" :key="p"><span><!-- include: message-segment --></span></template></span></span></template></span></template></span><span class="message-edited" x-show="message.editedAt">(edited)</span></span><template x-for="(media, mi) in mediaView.messageMedia(message.text)" :key="'media-' + message.id + '-' + mi"><span class="message-media-item" :class="'is-' + media.kind"><a class="giphy-caption" x-show="media.kind === 'giphy'" :href="media.url" :data-tooltip="media.url" x-tooltip target="_blank" rel="noopener noreferrer" x-text="media.label"></a><details class="image-preview" :open="!mediaView.isMediaCollapsed(message)" x-on:toggle="mediaView.setMediaCollapsed(message, !$event.target.open)"><summary :aria-label="media.kind === 'giphy' ? 'Toggle GIF' : media.kind === 'video' ? 'Toggle video' : 'Toggle image'"><svg class="image-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg class="image-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></summary><template x-if="media.kind === 'video'"><video class="message-video" :src="media.href + '#t=0.001'" :width="media.width || null" :height="media.height || null" :style="mediaView.mediaAspectStyle(media.href, media.width, media.height)" controls playsinline preload="metadata" aria-label="Video" x-on:click.stop></video></template><template x-if="media.kind !== 'video'"><button type="button" class="message-media" x-on:click.stop="mediaView.openLightbox(media)" :aria-label="media.kind === 'giphy' ? 'Open GIF' : 'Open photo'"><img class="thumb-img" :src="media.href" :alt="media.alt" :width="media.width || 640" :height="media.height || 480" x-init="$el.complete && mediaView.markLoaded($el)" x-on:load="mediaView.markLoaded($el); mediaView.recordMediaDims(media.href, $el.naturalWidth, $el.naturalHeight)" x-on:error="mediaView.recordMediaError(media.href)" :style="mediaView.mediaAspectStyle(media.href, media.width, media.height)" /></button></template></details><a class="media-fallback" x-show="media.kind === 'image' && media.url && mediaView.isMediaError(media.href)" :href="media.url" :data-tooltip="media.url" x-tooltip target="_blank" rel="noopener noreferrer" x-text="media.url"></a></span></template><template x-for="(segment, n) in linkSegments(messageText(message))" :key="'og-' + n"><details class="image-preview embed-card" x-show="segment.href && !isGiphyUrl(segment.href) && embeds[segment.href]?.kind !== 'image' && !mediaView.playerCard(segment.href) && embeds[segment.href] && (embeds[segment.href].title || embeds[segment.href].description || embeds[segment.href].image || embeds[segment.href].site)" :open="!mediaView.isMediaCollapsed(message)" x-on:toggle="mediaView.setMediaCollapsed(message, !$event.target.open)"><summary aria-label="Toggle link preview"><svg class="image-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg class="image-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></summary><div class="embed-og"><a :href="segment.href" target="_blank" rel="noopener noreferrer"><img class="thumb-img" x-show="embeds[segment.href]?.image && !mediaView.isMediaError(embedImageUrl(embeds[segment.href].image))" :src="embedImageUrl(embeds[segment.href]?.image || '')" loading="lazy" width="112" height="80" alt="" x-init="$el.complete && mediaView.markLoaded($el)" x-on:load="mediaView.markLoaded($el)" x-on:error="mediaView.recordMediaError(embedImageUrl(embeds[segment.href]?.image || ''))" /><span class="embed-copy"><strong x-text="embeds[segment.href]?.title || segment.href"></strong><span x-show="embeds[segment.href]?.description" x-text="embeds[segment.href]?.description"></span><small x-text="embeds[segment.href]?.site || (segment.href ? new URL(segment.href).hostname : '')"></small></span></a></div></details></template><template x-for="(segment, n) in linkSegments(messageText(message))" :key="'embed-' + n"><details class="image-preview embed-card" x-show="segment.href && mediaView.playerCard(segment.href)" :open="!mediaView.isMediaCollapsed(message)" x-on:toggle="mediaView.setMediaCollapsed(message, !$event.target.open)"><summary aria-label="Toggle video preview"><svg class="image-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg class="image-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/><path d="m11 8 5 4-5 4Z"/></svg></summary><button type="button" class="embed-thumb" aria-label="Play YouTube video" x-show="mediaView.playerCard(segment.href)?.site === 'YouTube'" x-on:click="mediaView.openPlayer(segment.href)"><img class="thumb-img" loading="lazy" width="16" height="9" x-show="mediaView.playerCard(segment.href)?.thumb" :src="mediaView.playerCard(segment.href)?.thumb" alt="" x-init="$el.complete && mediaView.markLoaded($el)" x-on:load="mediaView.markLoaded($el)" x-on:error="$el.closest('.embed-thumb').style.display = 'none'" /><span class="embed-play" aria-hidden="true"></span></button><button type="button" class="embed-player embed-thumb" x-show="mediaView.playerCard(segment.href)?.site !== 'YouTube'" x-on:click="mediaView.openPlayer(segment.href)"><img class="thumb-img" loading="lazy" width="16" height="9" x-show="mediaView.playerCard(segment.href)?.thumb" :src="mediaView.playerCard(segment.href)?.thumb" alt="" x-init="$el.complete && mediaView.markLoaded($el)" x-on:load="mediaView.markLoaded($el)" /><span class="embed-player-copy"><strong x-text="mediaView.playerCard(segment.href)?.title"></strong><small x-text="mediaView.playerCard(segment.href)?.site"></small></span></button></details></template><span class="outbox-status" :data-state="message.state" x-show="stateLabel(message)"><span x-text="stateLabel(message)"></span><template x-if="['saving', 'queued', 'sending'].includes(message.state)"><span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span></template><template x-if="message.state === 'uncertain'"><span> <label><input type="checkbox" name="consent" x-model="consent[message.id]" /> Resend may duplicate</label> <button type="button" class="outbox-retry" :disabled="!consent[message.id]" x-on:click="resend(message.id)">Resend</button></span></template></span><span class="agent-request-status" role="status" x-show="agentRequestLabel(message)" x-text="agentRequestLabel(message)"></span><span class="redact-status" x-show="redactLabel(message)"><span x-text="redactLabel(message)"></span> <button type="button" class="outbox-retry" x-show="redactFor(message) && (redactFor(message).state === 'failed' || redactFor(message).state === 'uncertain')" x-on:click.stop="retryRedact(message)" x-text="redactFor(message)?.state === 'uncertain' ? 'Resend delete' : 'Retry delete'"></button></span><span class="reaction-chips" x-show="reactionChips(message).length"><template x-for="chip in reactionChips(message)" :key="message.id + chip.emoji"><button type="button" class="reaction-chip" :class="[chip.mine && 'mine', actions.stampedReaction === (message.serverId + ':' + chip.emoji) && 'stamp']" :disabled="!reactionsReady()" :aria-label="chip.emoji + ', ' + chip.count" :data-tooltip="reactionTooltip(message, chip.emoji)" x-tooltip x-on:click.stop="chooseReaction(message, chip.emoji)"><template x-if="emoji.urlFor(chip.emoji)"><img class="custom-emoji" :src="emoji.urlFor(chip.emoji)" :alt="chip.emoji" /></template><span x-show="!emoji.urlFor(chip.emoji)" x-text="chip.emoji"></span><small x-text="chip.count"></small></button></template></span><button x-show="!activeThread && threadForMessage(message)" type="button" class="thread-link" x-on:click.stop="openThreadForMessage(message)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/></svg><span>Open thread</span></button><template x-if="!activeThread && !threadForMessage(message) && replyThreadSummaryFor(message)"><button type="button" class="reply-thread-bar" :class="replyThreadRootId === message.serverId && 'selected'" x-on:click.stop="openReplyThread(message)" x-data="{ get summary() { return replyThreadSummaryFor(message); } }"><span class="reply-thread-avatars" aria-hidden="true"><template x-for="nick in summary.participants" :key="nick"><span class="reply-thread-av"><img :src="avatarUrl(nick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /><span x-text="(nick || '?').slice(0, 1).toUpperCase()"></span></span></template></span><span class="reply-thread-count" x-text="summary.count === 1 ? '1 reply' : summary.count + ' replies'"></span><span class="reply-thread-last" x-text="'Last ' + formatTime(summary.lastTime)"></span></button></template></span>
