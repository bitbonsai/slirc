<span class="body"
  ><button
    x-show="replyThreadBroadcastParent(message)"
    type="button"
    class="reply-broadcast-note"
    x-on:click.stop="openReplyThread(replyThreadBroadcastParent(message))"
    ><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('corner-down-right')"
    ></span
    ><span
      x-text="'Also replied to ' + (replyThreadBroadcastParent(message)?.authorNick || '') + '\'s thread'"
    ></span
  ></button
  ><span class="message-copy"
    ><span class="body-seg"
    ><!-- include: message-text --></span
    ><span class="message-edited" x-show="message.editedAt"
    >(edited)</span
  ></span
  ><!-- include: message-media --><!-- include: message-embeds --><span
    class="outbox-status"
    :data-state="message.state"
    x-show="stateLabel(message)"
    ><span x-text="stateLabel(message)"
    ></span
    ><template x-if="messageView.isPending(message)"
      ><span class="typing-dots" aria-hidden="true"
        ><i
        ></i
        ><i
        ></i
        ><i
        ></i
      ></span
    ></template
    ><template x-if="message.state === 'uncertain'"
      ><span
        > <label
          ><input type="checkbox" name="consent" x-model="consent[message.id]"
        > Resend may duplicate</label
        > <button
          type="button"
          class="outbox-retry"
          :disabled="!consent[message.id]"
          x-on:click="resend(message.id)"
        >Resend</button
      ></span
    ></template
  ></span
  ><span
    class="agent-request-status"
    role="status"
    x-show="agentRequestLabel(message)"
    x-text="agentRequestLabel(message)"
  ></span
  ><span class="redact-status" x-show="redactLabel(message)"
    ><span x-text="redactLabel(message)"
    ></span
    > <button
      type="button"
      class="outbox-retry"
      x-show="messageView.canRetryRedact(message)"
      x-on:click.stop="retryRedact(message)"
      x-text="messageView.retryRedactLabel(message)"
    ></button
  ></span
  ><span class="reaction-chips" x-show="reactionChips(message).length"
    ><template x-for="chip in reactionChips(message)" :key="message.id + chip.emoji"
      ><button
        type="button"
        class="reaction-chip"
        :class="messageView.chipClass(message, chip)"
        :disabled="!reactionsReady()"
        :aria-label="chip.emoji + ', ' + chip.count"
        :data-tooltip="reactionTooltip(message, chip.emoji)"
        x-tooltip
        x-on:click.stop="chooseReaction(message, chip.emoji)"
        ><template x-if="emoji.urlFor(chip.emoji)"
          ><img class="custom-emoji" :src="emoji.urlFor(chip.emoji)" :alt="chip.emoji"
        ></template
        ><span x-show="!emoji.urlFor(chip.emoji)" x-text="chip.emoji"
        ></span
        ><small x-text="chip.count"
        ></small
      ></button
    ></template
  ></span
  ><button
    x-show="!activeThread && threadForMessage(message)"
    type="button"
    class="thread-link"
    x-on:click.stop="openThreadForMessage(message)"
    ><svg viewBox="0 0 24 24" aria-hidden="true"
      ><path d="M20 4v7a4 4 0 0 1-4 4H4"
      ></path
      ><path d="m9 10-5 5 5 5"
      ></path
    ></svg
    ><span
    >Open thread</span
  ></button
  ><template x-if="!activeThread && !threadForMessage(message) && replyThreadSummaryFor(message)"
    ><button
      type="button"
      class="reply-thread-bar"
      :class="replyThreadRootId === message.serverId && 'selected'"
      x-on:click.stop="openReplyThread(message)"
      x-data="{ get summary() { return replyThreadSummaryFor(message); } }"
      ><span class="reply-thread-avatars" aria-hidden="true"
        ><template x-for="nick in summary.participants" :key="nick"
          ><span class="reply-thread-av"
            ><img
              :src="avatarUrl(nick)"
              alt=""
              x-on:error="$el.hidden = true"
              x-on:load="$el.hidden = false"
            ><span x-text="messageView.initial(nick)"
            ></span
          ></span
        ></template
      ></span
      ><span class="reply-thread-count" x-text="messageView.replyCountLabel(summary.count)"
      ></span
      ><span class="reply-thread-last" x-text="'Last ' + formatTime(summary.lastTime)"
      ></span
    ></button
  ></template
></span>
