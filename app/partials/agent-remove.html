  <dialog class="custom-modal" aria-labelledby="agent-remove-title" tabindex="-1" x-on:keydown="agents.dialogKeydown($event)" x-cloak x-modal="!booting && authenticated && agents.removeTarget" x-on:cancel.prevent="if (!agents.busy) agents.closeRemove()">
    <section class="notice-card"><h2 id="agent-remove-title">Remove <span x-text="agents.removeTarget?.nick"></span>?</h2><p>This disconnects Slirc, removes the agent's DM and its threads, and revokes its credentials and channel access. It may not stop work already running locally.</p><p class="profile-error" role="alert" x-show="agents.error" x-text="agents.error"></p><div class="pair-actions"><button type="button" class="btn-secondary" autofocus :disabled="agents.busy" x-on:click="agents.closeRemove()">Cancel</button><button type="button" class="btn-danger" :disabled="agents.busy" x-on:click="agents.confirmRemove()" x-text="agents.busy ? 'Removing…' : 'Remove'"></button></div></section>
  </dialog>
