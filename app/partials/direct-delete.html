  <dialog x-data="directDelete" id="delete-dm-dialog" class="custom-modal" x-cloak x-on:cancel.prevent="directDelete.closeDirectDelete()" x-on:click="if ($event.target === $el) directDelete.closeDirectDelete()">
    <section class="notice-card delete-confirmation" role="alertdialog" aria-labelledby="delete-dm-title">
      <h2 id="delete-dm-title">Close DM with <span x-text="directDelete.directDeleteCandidate"></span>?</h2>
      <p>This hides the DM from your list only. The other person keeps the conversation and history. You can reopen it later.</p>
      <p class="profile-error" role="alert" x-show="directDelete.directDeleteError" x-text="directDelete.directDeleteError"></p>
      <div class="pair-actions">
        <button type="button" class="btn-secondary" autofocus :disabled="directDelete.directDeleteBusy" x-on:click="directDelete.closeDirectDelete()">Cancel</button>
        <button type="button" class="btn-danger" :disabled="directDelete.directDeleteBusy" x-on:click="directDelete.closeDirect()" x-text="directDelete.directDeleteBusy ? 'Closing…' : 'Close DM'"></button>
      </div>
    </section>
  </dialog>
