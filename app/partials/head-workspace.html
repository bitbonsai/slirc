<button type="button" class="head-workspace" x-show="canSwitchWorkspace" aria-haspopup="dialog" :aria-label="'Workspaces, now ' + workspace.name" x-on:click="openWorkspaces()"><span class="workspace-badge" aria-hidden="true" :class="workspace.logo ? 'logo' : workspace.iconReady ? 'logo icon' : ''" :style="workspace.logo || workspace.iconReady ? '' : 'background:' + workspace.color"><img x-show="workspace.logo || workspace.iconReady" :src="workspace.logo || workspace.icon || null" alt="" x-on:load="if (!workspace.logo) workspace.iconReady = true" x-on:error="workspace.iconReady = false" /><span x-show="!workspace.logo && !workspace.iconReady" x-text="workspace.letter"></span></span></button>
