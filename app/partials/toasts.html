    <!-- Toasts live in the shell so they show on every screen; without a composer they sit at the bottom. -->
    <div class="toast-region" role="status" aria-live="polite" x-cloak x-show="authenticated" :class="!view.composerSpace && 'no-composer'"><template x-for="item in stickies.slice(0, 3)" :key="item.id">
      <div class="glass-toast sticky" :class="item.icon === 'refresh' && 'hud'">
        <svg class="toast-icon" viewBox="0 0 24 24" aria-hidden="true" x-show="item.icon !== 'refresh'"><use href="/icons/lucide/sprite.svg#bell"></use></svg>
        <svg class="toast-icon" viewBox="0 0 24 24" aria-hidden="true" x-show="item.icon === 'refresh'"><use href="/icons/lucide/sprite.svg#rotate-cw"></use></svg>
        <span x-text="item.text" x-show="item.icon !== 'refresh'"></span>
        <span class="toast-marquee" :data-tooltip="item.text" x-tooltip x-show="item.icon === 'refresh'"><span class="sr-only" x-text="item.text"></span><span class="toast-marquee-track" aria-hidden="true" x-text="item.text"></span></span>
        <button type="button" class="toast-action" x-on:click="openSticky(item.id)" x-text="item.action"></button>
        <button type="button" class="toast-action quiet" x-show="item.icon !== 'refresh'" x-on:click="dismissSticky(item.id)">Dismiss</button>
        <button type="button" class="toast-close" aria-label="Dismiss update" x-show="item.icon === 'refresh'" x-on:click="dismissSticky(item.id)"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide/sprite.svg#x"></use></svg></button>
      </div>
    </template><template x-if="stickies.length > 3">
      <div class="glass-toast sticky more">
        <span x-text="(stickies.length - 3) + ' more ' + (stickies.length - 3 === 1 ? 'reminder' : 'reminders')"></span>
        <button type="button" class="toast-action" x-on:click="openSticky(stickies[3].id)">Open</button>
        <button type="button" class="toast-action quiet" x-on:click="dismissAllStickies()">Dismiss all</button>
      </div>
    </template><template x-for="text in (note ? [note] : [])" :key="text">
      <div class="glass-toast" :style="'--toast-ms: ' + Math.min(9, 5 + Math.floor(text.length / 30)) * 1000 + 'ms'" x-on:animationend="if (/^toast-(progress|hold)$/.test($event.animationName) && note === text) note = ''">
        <span x-text="text"></span>
        <button type="button" class="notify-banner-close" aria-label="Dismiss notification" x-on:click="note = ''"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide/sprite.svg#x"></use></svg></button>
      </div>
    </template></div>
