  <nav class="instance-rail" :class="railMoving && 'moving'" x-cloak x-show="railVisible()" aria-label="Workspaces">
    <div class="instance-rail-list" x-effect="railRows(); $nextTick(() => animateRail($el))">
      <template x-for="item in railRows().shown" :key="item.origin">
        <button type="button" class="instance-rail-item" :class="item.current && 'active'" :aria-current="item.current ? 'true' : null" :aria-label="item.current ? item.name + ', current workspace' : 'Switch to ' + item.name + (railBadge(item.origin) ? ', ' + railBadge(item.origin) + ' unread' : '')" :data-tooltip="item.name" x-tooltip :disabled="workspaceBusy" x-on:click="pickWorkspace(item.origin)"><span class="instance-rail-pill" aria-hidden="true"></span><span class="workspace-badge" aria-hidden="true" :class="item.logo ? 'logo' : item.iconReady ? 'logo icon' : ''" :style="item.logo || item.iconReady ? '' : 'background:' + item.color"><img x-show="item.logo || item.iconReady" :src="item.logo || item.icon || null" alt="" x-on:load="if (!item.logo) item.iconReady = true" x-on:error="item.logo = ''; item.iconReady = false" /><span x-show="!item.logo && !item.iconReady" x-text="item.letter"></span></span><span class="unread-badge instance-rail-unread" x-show="railBadge(item.origin)" x-text="railBadge(item.origin)"></span></button>
      </template>
      <template x-if="railRows().peek">
        <button type="button" class="instance-rail-item instance-rail-peek" :aria-label="'Show all workspaces, ' + railRows().peek.name + ' next'" x-on:click="toggleRail()"><span class="instance-rail-pill" aria-hidden="true"></span><span class="workspace-badge" aria-hidden="true" :class="railRows().peek.logo ? 'logo' : railRows().peek.iconReady ? 'logo icon' : ''" :style="railRows().peek.logo || railRows().peek.iconReady ? '' : 'background:' + railRows().peek.color"><img x-show="railRows().peek.logo || railRows().peek.iconReady" :src="railRows().peek.logo || railRows().peek.icon || null" alt="" x-on:load="if (!railRows().peek.logo) railRows().peek.iconReady = true" x-on:error="railRows().peek.logo = ''; railRows().peek.iconReady = false" /><span x-show="!railRows().peek.logo && !railRows().peek.iconReady" x-text="railRows().peek.letter"></span></span></button>
      </template>
      <button type="button" class="instance-rail-item instance-rail-fold" x-show="railRows().foldable" :class="railExpanded && 'open'" :aria-expanded="String(railExpanded)" :aria-label="railExpanded ? 'Show fewer workspaces' : 'Show all (' + workspaceChoices.length + ')'" :data-tooltip="railExpanded ? 'Show fewer' : 'Show all (' + workspaceChoices.length + ')'" x-tooltip x-on:click="toggleRail()"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('chevron-down')"></span></button>
    </div>
    <button type="button" class="instance-rail-item instance-rail-add" aria-haspopup="dialog" aria-label="Add or manage workspaces" data-tooltip="Add a workspace" x-tooltip :aria-expanded="String(workspaceDialog)" x-on:click="openWorkspaces()"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('plus')"></span></button>
  </nav>
