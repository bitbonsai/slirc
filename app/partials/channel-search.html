  <dialog id="channel-search-dialog" class="custom-modal palette-modal" x-data="channelSearchDialog" x-cloak aria-label="Search messages" x-on:cancel.prevent="close()" x-on:click="if ($event.target === $el) close()">
    <section class="palette channel-search-palette">
      <div class="channel-search-head" :class="hasQuery && 'has-results'">
        <span class="channel-search-icon" aria-hidden="true" x-html="lucideIcon('search')"></span>
        <input id="channel-search-input" class="palette-input channel-search-input" x-ref="search" type="text" role="combobox" :aria-label="placeholder()" aria-autocomplete="list" :aria-expanded="String(hasQuery)" aria-controls="channel-search-list" :aria-activedescendant="activeId()" autocomplete="off" spellcheck="false" :placeholder="placeholder()" x-model="query" x-on:input="onInput($event)" x-on:keydown="keydown($event)" />
        <span class="channel-search-filters" role="group" aria-label="Filter results">
          <button type="button" class="channel-search-chip" :aria-pressed="String(kind === 'images')" x-on:click="toggleKind('images')">Images</button>
          <button type="button" class="channel-search-chip" :aria-pressed="String(kind === 'links')" x-on:click="toggleKind('links')">Links</button>
        </span>
        <button type="button" class="channel-search-clear" x-show="query" aria-label="Clear search" x-on:click="clear()"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('x')"></span></button>
      </div>
      <div class="channel-search-body" x-ref="body"><div x-ref="inner">
      <div id="channel-search-list" class="palette-list" x-ref="list" role="listbox" aria-label="Matching messages" x-show="hasQuery">
        <template x-for="(row, i) in hits" :key="row.id">
          <button type="button" tabindex="-1" role="option" class="search-hit" :id="'channel-search-option-' + i" :class="i === index && 'active'" :aria-selected="String(i === index)" x-on:mouseenter="index = i" x-on:click="choose(row)">
            <span class="palette-mark" aria-hidden="true"><span x-text="(row.authorNick || '?').slice(0, 1).toUpperCase()"></span><img :src="avatarUrl(row.authorNick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /></span>
            <span class="palette-copy search-hit-body">
              <span class="search-hit-head"><strong x-text="row.authorNick"></strong><span class="search-hit-thread" x-show="row.thread" x-text="row.thread"></span><span class="search-hit-time" x-text="row.timeLabel"></span></span>
              <span class="search-hit-snippet"><template x-for="(seg, j) in row.segments" :key="j"><span :class="seg.hit && 'search-hit-mark'" x-text="seg.text"></span></template></span>
              <span class="search-hit-card" x-show="row.link">
                <img class="search-hit-card-img" x-show="row.link && row.link.thumb" :src="(row.link && row.link.thumb) || null" alt="" loading="lazy" x-on:error="$el.hidden = true" />
                <span class="search-hit-card-copy"><strong x-text="row.link && (row.link.title || row.link.host)"></strong><small x-text="row.link && row.link.host"></small></span>
              </span>
            </span>
            <img class="search-hit-thumb" x-show="row.thumb" :src="row.thumb || null" alt="" loading="lazy" x-on:error="$el.hidden = true" />
          </button>
        </template>
        <p class="palette-empty" x-show="hasQuery && !searching && !hits.length" role="status">No matches in loaded messages.</p>
      </div>
      <div class="palette-foot channel-search-foot" x-show="hasQuery || loadError">
        <span class="channel-search-status" role="status" x-show="hasQuery || loadError" x-text="statusText()"></span>
        <button type="button" class="channel-search-older" x-show="hasQuery && !isNotes && !exhausted" :aria-disabled="String(loadingOlder)" x-on:click="loadOlder(); $refs.search.focus()" x-text="loadingOlder ? 'Loading…' : 'Load older'"></button>
      </div>
      </div></div>
    </section>
  </dialog>
