  <aside id="rooms" class="rooms" x-cloak x-show="authenticated && isDesktop && roomsOpen" x-transition:enter="rooms-enter" x-transition:enter-start="rooms-hidden" x-transition:enter-end="rooms-visible" x-transition:leave="rooms-leave" x-transition:leave-start="rooms-visible" x-transition:leave-end="rooms-hidden" x-on:click.self="if (!isDesktop) roomsOpen = false">
    <div class="rooms-sheet">
      <div class="draft-section starred-section" x-show="starredItems().length" x-transition:enter="draft-enter" x-transition:enter-start="draft-enter-start" x-transition:enter-end="draft-enter-end" x-transition:leave="draft-leave" x-transition:leave-start="draft-leave-start" x-transition:leave-end="draft-leave-end"><div class="draft-section-inner"><button class="section-title" type="button" :class="!starredOpen && 'collapsed'" :aria-expanded="starredOpen" x-on:click="starredOpen = !starredOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Starred</span></button><div x-show="starredOpen"><template x-for="item in starredItems()" :key="'starred-' + item.conversationId"><div class="draft-section star-item" x-transition:enter="draft-enter" x-transition:enter-start="draft-enter-start" x-transition:enter-end="draft-enter-end" x-transition:leave="draft-leave" x-transition:leave-start="draft-leave-start" x-transition:leave-end="draft-leave-end"><div class="draft-section-inner"><div class="channel-row"><button class="room" type="button" :class="[(item.kind === 'dm' ? direct && channel === item.nick : !direct && channel === item.wireTarget) && 'active', isMuted(item.kind === 'dm' ? 'dm:' + item.conversationId : item.wireTarget) && 'muted-room']" x-on:click="item.kind === 'dm' ? openDirect(item.nick) : openRoom(item.wireTarget)"><template x-if="item.kind === 'dm'"><span class="room-mark peer-avatar avatar-status-host" aria-hidden="true" :data-status="avatarStatus(item.nick)"><span>@</span><img :src="avatarUrl(item.nick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /></span></template><template x-if="item.kind !== 'dm'"><span class="room-mark channel" aria-hidden="true" :class="isOpenRoom(item.wireTarget) && 'open'"><span class="lock-icon" x-show="!isOpenRoom(item.wireTarget)"></span><span class="channel-hash" x-show="isOpenRoom(item.wireTarget)">#</span></span></template><span class="sr-only" x-show="item.kind === 'dm'" x-text="avatarStatusLabel(item.nick)"></span><span class="room-name" x-text="item.label"></span><span class="unread-badge" x-show="unreadCount(item.conversationId)" x-text="badgeText(item.conversationId)"></span></button><button class="channel-kebab" type="button" :aria-label="'Options for ' + item.label" x-on:click.stop="menus.openNavMenu($event, item.conversationId, item.kind, item.kind === 'dm' ? item.nick : item.wireTarget, item.label)">⋮</button></div></div></div></template></div></div></div>
      <div class="draft-section" x-show="draftsList().length" x-transition:enter="draft-enter" x-transition:enter-start="draft-enter-start" x-transition:enter-end="draft-enter-end" x-transition:leave="draft-leave" x-transition:leave-start="draft-leave-start" x-transition:leave-end="draft-leave-end">
        <div class="draft-section-inner">
        <button class="section-title" type="button" :class="!draftsOpen && 'collapsed'" :aria-expanded="draftsOpen" x-on:click="draftsOpen = !draftsOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Drafts</span></button>
        <div x-show="draftsOpen"><template x-for="draft in draftsList()" :key="draft.conversationId">
          <div class="channel-row draft-row">
            <button class="room draft-room" type="button" x-on:click="openDraft(draft.conversationId)"><span class="room-mark" aria-hidden="true"><span class="menu-icon" x-html="lucideIcon('pencil')"></span></span><span><span class="room-name" x-text="draft.label"></span><small x-text="draft.text"></small></span></button>
            <button class="draft-delete" type="button" :aria-label="'Delete draft for ' + draft.label" x-tooltip x-on:click.stop="deleteDraft(draft.conversationId)" x-html="lucideIcon('trash')"></button>
          </div>
        </template></div>
        </div>
      </div>
      <div class="section-head"><button class="section-title" type="button" :class="!channelsOpen && 'collapsed'" :aria-expanded="channelsOpen" x-on:click="channelsOpen = !channelsOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Channels</span></button><button class="section-add" type="button" aria-label="Create a channel" data-tooltip="Create a channel" x-tooltip x-on:click="openChannels()"><img src="/icons/ui/plus.svg?v=555549fc" alt="" /></button></div>
      <div id="channel-list" x-show="channelsOpen" :class="channelDrag.draggingId && 'is-dragging'"><template x-for="item in channelList()" :key="item.conversationId"><div class="channel-item" :data-channel-id="item.conversationId"><div class="channel-row" :class="channelDrag.draggingId === item.conversationId && 'is-dragging'" x-on:pointerdown="channelDrag.pointerDown($event, item.conversationId)"><button class="room" :class="[channel === item.wireTarget && !direct && 'active', isMuted(item.wireTarget) && 'muted-room']" type="button" x-on:click="if (!channelDrag.consumeClick()) openRoom(item.wireTarget)" x-on:keydown="channelDrag.keydown($event, item.conversationId)"><span class="room-mark channel" aria-hidden="true" :class="isOpenRoom(item.wireTarget) && 'open'"><span class="lock-icon" x-show="!isOpenRoom(item.wireTarget)"></span><span class="channel-hash" x-show="isOpenRoom(item.wireTarget)">#</span></span><span class="room-name" x-text="item.wireTarget.replace(/^#/, '')"></span><span class="unread-badge" x-show="unreadCount(item.conversationId)" x-text="badgeText(item.conversationId)"></span></button><button class="channel-kebab" type="button" aria-label="Channel options" x-on:click.stop="menus.openNavMenu($event, item.conversationId, 'room', item.wireTarget, item.wireTarget)">⋮</button></div></div></template></div>
      
      <div x-show="replyThreads.items.length">
        <button class="section-title" type="button" :class="!replyThreads.listOpen && 'collapsed'" :aria-expanded="replyThreads.listOpen" x-on:click="replyThreads.toggle()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Threads</span><span class="unread-badge" x-show="!replyThreads.listOpen && replyThreads.unreadTotal()" x-text="replyThreads.badge(replyThreads.unreadTotal())" :aria-label="replyThreads.unreadTotal() + ' unread'"></span></button>
        <div x-show="replyThreads.listOpen"><template x-for="thread in replyThreads.visible().shown" :key="'reply-thread-' + thread.rootId"><div class="channel-row"><button class="room thread-room" :class="replyThreads.isActive(thread) && 'active'" type="button" :aria-label="'Open thread: ' + thread.title + ', ' + thread.label + (thread.unread ? ', ' + thread.unread + ' unread' : '')" x-on:click="replyThreads.open(thread)"><span class="room-mark" aria-hidden="true"><svg viewBox="0 0 24 24" style="width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg></span><span><span class="thread-name" x-text="thread.title"></span><small x-text="thread.label"></small></span><span class="unread-badge" x-show="thread.unread" x-text="replyThreads.badge(thread.unread)"></span></button></div></template><div class="channel-row nested-thread" x-show="replyThreads.visible().more > 0 || replyThreads.collapsible()"><button class="room thread-room thread-more" type="button" x-on:click="replyThreads.toggleExpanded()"><span class="room-mark" aria-hidden="true"><svg viewBox="0 0 24 24" style="width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span class="thread-name" x-text="replyThreads.expanded ? 'Show fewer' : replyThreads.visible().more + ' more'"></span></button></div></div>
      </div>
      <div x-show="agentList().length"><div class="section-head"><button class="section-title" type="button" :class="!agentsOpen && 'collapsed'" :aria-expanded="agentsOpen" x-on:click="agentsOpen = !agentsOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Agents</span></button><button class="section-add" type="button" aria-label="Connect an agent" data-tooltip="Connect an agent" x-tooltip x-on:click="openAgents()"><img src="/icons/ui/plus.svg?v=555549fc" alt="" /></button></div><div x-show="agentsOpen"><template x-for="item in agentList()" :key="'agent-' + item.nick"><div><div class="channel-row"><button class="room" :class="[direct && channel === item.nick && 'active', isMuted('dm:' + conversationIdForDm(item.channel)) && 'muted-room']" type="button" :disabled="directBusy === item.nick" x-on:click="openDirect(item.nick)" :data-tooltip="item.nick + ' · ' + avatarStatusLabel(item.nick)" x-tooltip><span class="room-mark peer-avatar avatar-status-host" aria-hidden="true" :data-status="avatarStatus(item.nick)"><span>@</span><img loading="lazy" :src="avatarUrl(item.nick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /></span><span class="room-name" x-text="item.label"></span><span class="sr-only" x-text="avatarStatusLabel(item.nick)"></span><span class="unread-badge" x-show="unreadCount(conversationIdForDm(item.channel))" x-text="badgeText(conversationIdForDm(item.channel))"></span></button><button class="channel-kebab" type="button" x-show="item.channel" :aria-label="'Options for ' + item.label" x-on:click.stop="menus.openNavMenu($event, conversationIdForDm(item.channel), 'dm', item.nick, item.label)">⋮</button></div></div></template></div></div>
      <div class="section-head"><button class="section-title" type="button" :class="!dmsOpen && 'collapsed'" :aria-expanded="dmsOpen" x-on:click="dmsOpen = !dmsOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Direct messages</span></button><button class="section-add" type="button" aria-label="New conversation" data-tooltip="New conversation" x-tooltip x-on:click="newConversation.open($event)"><img src="/icons/ui/plus.svg?v=555549fc" alt="" /></button></div><div x-show="dmsOpen"><div class="channel-row notes-row"><button class="room" type="button" :class="notesOpen && 'active'" x-on:click="openNotes()"><span class="room-mark" aria-hidden="true"><span class="menu-icon" x-html="lucideIcon('notebook-pen')"></span></span><span class="room-name">Notes</span></button></div><template x-for="item in directList()" :key="item.conversationId || item.channel"><div><div class="channel-row"><button class="room" :class="[direct && channel === item.nick && 'active', isMuted('dm:' + conversationIdForDm(item.channel)) && 'muted-room']" type="button" x-on:click="openDirect(item.nick)" :data-tooltip="item.nick + ' · ' + avatarStatusLabel(item.nick)" x-tooltip><span class="room-mark peer-avatar avatar-status-host" aria-hidden="true" :data-status="avatarStatus(item.nick)"><span>@</span><img loading="lazy" :src="avatarUrl(item.nick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /></span><span class="room-name" x-text="item.nick"></span><span class="sr-only" x-text="avatarStatusLabel(item.nick)"></span><span class="unread-badge" x-show="unreadCount(conversationIdForDm(item.channel))" x-text="badgeText(conversationIdForDm(item.channel))"></span></button><button class="channel-kebab" type="button" x-show="!item.pending" aria-label="Direct message options" x-on:click.stop="menus.openNavMenu($event, conversationIdForDm(item.channel), 'dm', item.nick, item.nick)">⋮</button></div></div></template>
<template x-for="item in groupList()" :key="'group-' + item.conversationId"><div class="channel-row"><button class="room" :class="[!direct && channel === item.wireTarget && 'active']" type="button" x-on:click="openRoom(item.wireTarget)"><span class="room-mark channel" aria-hidden="true" :class="isOpenRoom(item.wireTarget) && 'open'"><span class="lock-icon" x-show="!isOpenRoom(item.wireTarget)"></span><span class="channel-hash" x-show="isOpenRoom(item.wireTarget)">#</span></span><span class="room-name" x-text="roomLabelFor(item.wireTarget)"></span><span class="unread-badge" x-show="unreadCount(item.conversationId)" x-text="badgeText(item.conversationId)"></span></button><button class="channel-kebab" type="button" :aria-label="'Group options for ' + roomLabelFor(item.wireTarget)" x-on:click.stop="menus.openNavMenu($event, item.conversationId, 'room', item.wireTarget, roomLabelFor(item.wireTarget))">⋮</button></div></template>
    </div>
      <div x-show="contactList().length"><div class="section-head"><button class="section-title" type="button" :class="!contactsOpen && 'collapsed'" :aria-expanded="contactsOpen" x-on:click="contactsOpen = !contactsOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>Contacts</span></button></div><div x-show="contactsOpen"><template x-for="nick in contactList()" :key="'contact-' + nick"><div class="channel-row"><button class="room" type="button" :disabled="directBusy === nick" x-on:click="openDirect(nick)" :data-tooltip="nick + ' · ' + avatarStatusLabel(nick)" x-tooltip><span class="room-mark peer-avatar avatar-status-host" aria-hidden="true" :data-status="avatarStatus(nick)"><span>@</span><img loading="lazy" :src="avatarUrl(nick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /></span><span class="room-name" x-text="nick"></span><span class="sr-only" x-text="avatarStatusLabel(nick)"></span></button></div></template></div></div>
    </div>
    <div class="panel-footer">
        <div class="rail-shortcut" x-show="isDesktop && !hasPhone && !phoneShortcutDismissed">
          <button type="button" class="rail-link" x-on:click="addPhone()"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('smartphone')"></span><span>Add your phone</span></button>
          <button type="button" class="rail-dismiss" aria-label="Hide add your phone shortcut" x-on:click="dismissPhoneShortcut(); $nextTick(() => $refs.railProfile?.focus())"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('x')"></span></button>
        </div>
        <div class="rail-shortcut" x-show="!invitationsPage.shortcutDismissed && !(isDesktop && !hasPhone && !phoneShortcutDismissed)">
          <button type="button" class="rail-link" x-on:click="newConversation.open($event)"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('user-plus')"></span><span>Invite someone</span></button>
          <button type="button" class="rail-dismiss" aria-label="Hide invite shortcut" x-on:click="invitationsPage.dismissShortcut(); $nextTick(() => $refs.railProfile?.focus())"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('x')"></span></button>
        </div>
        <div class="profile-card">
          <button type="button" class="profile-main" x-ref="railProfile" x-on:click="openProfile()" :aria-label="'Your profile · ' + avatarStatusLabel(account)" x-tooltip>
            <span class="profile-avatar avatar-status-host" :data-status="avatarStatus(account)" aria-hidden="true" :style="'background:' + ['#f5c2e7','#cba6f7','#eba0ac','#fab387','#f9e2af','#a6e3a1','#94e2d5','#89dceb','#74c7ec','#89b4fa','#b4befe'][([...((account || '').toLowerCase())].reduce((v, c) => Math.imul(31, v) + c.charCodeAt(0) | 0, 0) >>> 0) % 11] + ';color:#11111b'">
              <img :src="avatarUrl(account)" alt="" x-on:load="$el.hidden = false" x-on:error="$el.hidden = true" />
              <span x-text="(account || '?').slice(0, 1).toUpperCase()"></span>
            </span>
            <span class="profile-copy"><strong><span x-text="me"></span><span class="admin-badge" x-show="isAdmin" role="img" aria-label="Administrator" x-html="lucideIcon('user-star')"></span></strong><small x-text="'@' + account"></small></span>
            <span class="menu-icon" aria-hidden="true" style="width:1rem;height:1rem;color:var(--muted)"><svg viewBox="0 0 24 24" style="width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m9 6 6 6-6 6"/></svg></span>
          </button>
        </div>
    </div>
  </aside>
