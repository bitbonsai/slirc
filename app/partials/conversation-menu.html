  <div x-data="conversationMenu" class="channel-menu nav-menu" x-cloak x-show="menus.starMenuId && menus.navMenu" x-transition.opacity :style="menus.navMenuStyle()" role="menu" :aria-label="'Options for ' + (menus.navMenu?.label || '')" x-on:click.outside="if (!$event.target.closest('.channel-flyout')) { menus.starMenuId = ''; menus.navMenu = null; menus.copyFlyout = null; }" x-on:keydown.escape.window="menus.starMenuId = ''; menus.navMenu = null; menus.copyFlyout = null">
    <template x-if="menus.navMenu?.kind === 'room' || menus.navMenu?.kind === 'dm'"><div><button type="button" x-on:mouseenter="menus.copyFlyout = null" x-on:click="toggleStar(menus.navMenu.id)"><span class="menu-icon" x-html="lucideIcon('star')"></span><span x-text="isStarred(menus.navMenu.id) ? 'Unstar' : 'Star'"></span></button><template x-if="menus.navMenu.kind === 'dm'"><div><button type="button" x-on:mouseenter="menus.copyFlyout = null" x-on:click="people.openWhois(menus.navMenu.target); menus.starMenuId = ''; menus.navMenu = null"><span class="menu-icon" x-html="lucideIcon('user')"></span><span>View profile</span></button><button type="button" x-on:mouseenter="menus.copyFlyout = null" x-on:click="toggleMute('dm:' + menus.navMenu.id); menus.starMenuId = ''; menus.navMenu = null"><span class="menu-icon" x-html="lucideIcon(isMuted('dm:' + menus.navMenu.id) ? 'bell-off' : 'bell')"></span><span x-text="isMuted('dm:' + menus.navMenu.id) ? 'Unmute' : 'Mute'"></span></button><button type="button" class="danger" x-on:click.stop="directDelete.openDirectDelete($event, menus.navMenu.target)"><span class="menu-icon" x-html="lucideIcon('trash')"></span><span>Close DM</span></button></div></template><template x-if="menus.navMenu.kind === 'room'"><div><button type="button" x-on:mouseenter="menus.copyFlyout = null" x-on:click="toggleMute(menus.navMenu.target); menus.starMenuId = ''; menus.navMenu = null"><span class="menu-icon" x-html="lucideIcon(isMuted(menus.navMenu.target) ? 'bell-off' : 'bell')"></span><span x-text="isMuted(menus.navMenu.target) ? 'Unmute' : 'Mute'"></span></button><div class="menu-divider"></div><button type="button" :aria-expanded="menus.copyFlyout?.conversationId === menus.navMenu.id" x-on:mouseenter="menus.openCopyFlyout($event, menus.navMenu.id, menus.navMenu.target)" x-on:click.stop="menus.openCopyFlyout($event, menus.navMenu.id, menus.navMenu.target)"><span class="menu-icon" x-html="lucideIcon('copy')"></span><span>Copy</span><span class="menu-caret" x-html="lucideIcon('chevron-right')"></span></button><button type="button" x-on:mouseenter="menus.copyFlyout = null" x-on:click="channelPrefs.openChannelSettings(menus.navMenu.target)"><span class="menu-icon" x-html="lucideIcon('settings')"></span><span>Channel settings…</span></button></div></template></div></template>
    <template x-if="menus.navMenu?.kind === 'thread'"><div><button type="button" x-on:click="openRoom(menus.navMenu.target); menus.starMenuId = ''; menus.navMenu = null"><span class="menu-icon" x-html="lucideIcon('corner-up-right')"></span><span>Open thread</span></button><button type="button" x-on:click="menus.copyThreadLink()"><span class="menu-icon" x-html="lucideIcon('link')"></span><span>Copy link</span></button><button type="button" class="danger" x-show="threadDelete.canDelete(menus.navMenu.target)" x-on:click.stop="threadDelete.openThreadDelete($event, menus.navMenu.target)"><span class="menu-icon" x-html="lucideIcon('trash')"></span><span>Delete thread</span></button></div></template>
  </div>
  <div class="channel-flyout" x-cloak x-show="menus.copyFlyout" x-transition.opacity :style="menus.copyFlyoutStyle()" role="menu" aria-label="Copy options" x-on:click.outside="if (!$event.target.closest('.nav-menu')) { menus.copyFlyout = null; menus.starMenuId = ''; menus.navMenu = null; }" x-on:keydown.escape.window="menus.copyFlyout = null; menus.starMenuId = ''; menus.navMenu = null">
    <button type="button" role="menuitem" x-on:click.stop="menus.copyChannelText('name')"><span class="menu-icon" x-html="lucideIcon('hash')"></span>Name</button>
    <button type="button" role="menuitem" x-on:click.stop="menus.copyChannelText('link')"><span class="menu-icon" x-html="lucideIcon('link')"></span>Link</button>
  </div>
