  <aside id="reply-thread-panel" class="reply-thread-panel" x-cloak x-show="authenticated && !activeThread && !notesOpen" :class="replyThreadRootId && 'open'" :aria-hidden="replyThreadRootId ? 'false' : 'true'" x-effect="const open = authenticated && !!replyThreadRootId && !activeThread && !notesOpen; document.body.classList.toggle('reply-thread-docked', isDesktop && open); $el.inert = !open" aria-label="Thread" x-on:keydown.escape.stop="closeReplyThread()">
    <div class="reply-thread-head">
      <button type="button" class="mobile-back reply-thread-back" x-show="!isDesktop" :aria-label="'Back to ' + (roomLabel || channel)" x-on:click="backFromReplyThread()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="reply-thread-title">
        <span class="room-mark channel reply-thread-lock" x-show="!isDesktop && !direct && !isOpenRoom(channel)" aria-hidden="true"><span class="lock-icon"></span></span>
        <strong>Thread</strong>
        <small x-text="roomLabel || channel"></small>
      </div>
      <button type="button" class="link-button reply-thread-close reply-thread-more" x-ref="more" x-show="isDesktop && activeReplyThreadRoot()?.serverId" aria-label="More message actions" aria-haspopup="menu" :aria-expanded="actions.actionMessageId === activeReplyThreadRoot()?.id" data-tooltip="More" x-tooltip x-on:click.stop="actions.toggleMenuAt(activeReplyThreadRoot())"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      <button type="button" class="link-button reply-thread-close" x-show="isDesktop" aria-label="Close thread" data-tooltip="Close (Esc)" x-tooltip x-on:click="closeReplyThread()"><span class="menu-icon" aria-hidden="true" x-html="lucideIcon('chevron-right')"></span></button>
    </div>
    <!-- At the end of <body>: the panel's backdrop-filter is a backdrop root, so a menu inside it blurs nothing. -->
    <template x-teleport="body">
      <div class="message-menu reply-thread-menu" x-data="{ get message() { return activeReplyThreadRoot(); } }" x-show="actions.panelMenu && actions.actionMessageId === message?.id" x-effect="actions.panelMenu && placeMenuUnder($el, $refs.more)" x-on:resize.window="actions.panelMenu && placeMenuUnder($el, $refs.more)" x-on:click.stop x-on:click.outside="actions.closeMessageMenu(false)" x-on:keydown="actions.menuKeydown($event)" x-on:focusout="if (!$el.contains($event.relatedTarget) && !(actions.remindOpen && !$event.relatedTarget)) actions.closeMessageMenu(false)">
        <!-- include: message-menu -->
      </div>
    </template>
    <div class="reply-thread-stream" id="reply-thread-stream">
      <template x-if="activeReplyThreadRoot()">
        <div class="reply-thread-root" x-data="{ get message() { return activeReplyThreadRoot(); } }">
          <div class="reply-row">
            <span class="reply-avatar" aria-hidden="true"><img :src="avatarUrl(message.authorNick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /><span x-text="(message.authorNick || '?').slice(0, 1).toUpperCase()"></span></span>
            <div class="reply-main">
              <div class="reply-meta"><strong x-text="message.authorNick"></strong><time :datetime="message.time" x-text="formatTime(message.time)"></time></div>
              <div class="reply-body"><template x-for="(segment, n) in textSegments(messageText(message))" :key="n"><span><!-- include: message-segment --><template x-if="segment.marker"><span class="list-item"><span class="list-marker" aria-hidden="true" x-text="segment.marker"></span><span class="list-text"><template x-for="(segment, p) in segment.parts" :key="p"><span><!-- include: message-segment --></span></template></span></span></template></span></template></div>
              <template x-if="!isDesktop"><div class="reply-root-media"><template x-for="(media, mi) in mediaView.messageMedia(message.text)" :key="'media-' + message.id + '-' + mi"><span class="message-media-item" :class="'is-' + media.kind"><a class="giphy-caption" x-show="media.kind === 'giphy'" :href="media.url" :data-tooltip="media.url" x-tooltip target="_blank" rel="noopener noreferrer" x-text="media.label"></a><details class="image-preview" :open="!mediaView.isMediaCollapsed(message)" x-on:toggle="mediaView.setMediaCollapsed(message, !$event.target.open)"><summary :aria-label="media.kind === 'giphy' ? 'Toggle GIF' : media.kind === 'video' ? 'Toggle video' : 'Toggle image'"><svg class="image-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg class="image-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></summary><template x-if="media.kind === 'video'"><video class="message-video" :src="media.href + '#t=0.001'" :width="media.width || null" :height="media.height || null" :style="mediaView.mediaAspectStyle(media.href, media.width, media.height)" controls playsinline preload="metadata" aria-label="Video" x-on:click.stop></video></template><template x-if="media.kind !== 'video'"><button type="button" class="message-media" x-on:click.stop="mediaView.openLightbox(media)" :aria-label="media.kind === 'giphy' ? 'Open GIF' : 'Open photo'"><img class="thumb-img" :src="media.href" :alt="media.alt" :width="media.width || 640" :height="media.height || 480" x-init="$el.complete && mediaView.markLoaded($el)" x-on:load="mediaView.markLoaded($el); mediaView.recordMediaDims(media.href, $el.naturalWidth, $el.naturalHeight)" x-on:error="mediaView.recordMediaError(media.href)" :style="mediaView.mediaAspectStyle(media.href, media.width, media.height)" /></button></template></details><a class="media-fallback" x-show="media.kind === 'image' && media.url && mediaView.isMediaError(media.href)" :href="media.url" :data-tooltip="media.url" x-tooltip target="_blank" rel="noopener noreferrer" x-text="media.url"></a></span></template></div></template>
            </div>
          </div>
        </div>
      </template>
      <div class="reply-thread-divider" x-show="activeReplyThreadReplies().length">
        <span x-text="activeReplyThreadReplies().length === 1 ? '1 reply' : activeReplyThreadReplies().length + ' replies'"></span>
      </div>
      <p class="reply-thread-empty" x-show="!activeReplyThreadReplies().length">No replies yet. Replies stay in this thread.</p>
      <template x-for="message in activeReplyThreadReplies()" :key="message.id">
        <div class="reply-row" :class="[(message.state === 'saving' || message.state === 'queued' || message.state === 'sending') && 'pending']">
          <span class="reply-avatar" aria-hidden="true"><img :src="avatarUrl(message.authorNick)" alt="" x-on:error="$el.hidden = true" x-on:load="$el.hidden = false" /><span x-text="(message.authorNick || '?').slice(0, 1).toUpperCase()"></span></span>
          <div class="reply-main">
            <div class="reply-meta"><strong x-text="message.authorNick"></strong><time :datetime="message.time" x-text="formatTime(message.time)"></time><span class="reply-broadcast-pill" x-show="message.broadcast">also in channel</span></div>
            <div class="reply-body"><template x-for="(segment, n) in textSegments(messageText(message))" :key="n"><span><!-- include: message-segment --><template x-if="segment.marker"><span class="list-item"><span class="list-marker" aria-hidden="true" x-text="segment.marker"></span><span class="list-text"><template x-for="(segment, p) in segment.parts" :key="p"><span><!-- include: message-segment --></span></template></span></span></template></span></template></div>
            <span class="outbox-status" :data-state="message.state" x-show="stateLabel(message)"><span x-text="stateLabel(message)"></span></span>
          </div>
        </div>
      </template>
    </div>
    <form class="reply-thread-composer" x-on:submit.prevent="sendReplyThread()">
      <p class="profile-error" role="alert" x-show="replyThreadError" x-text="replyThreadError"></p>
      <label class="reply-also-check"><input type="checkbox" x-model="replyThreadBroadcast" /> <span x-text="'Also send to ' + (roomLabel || channel)"></span></label>
      <div class="reply-composer-box">
        <textarea id="reply-thread-input" rows="1" placeholder="Reply in thread…" x-model="replyThreadDraft" x-on:keydown="replyThreadKeydown($event)"></textarea>
        <button type="submit" class="reply-send-btn" :disabled="!replyThreadDraft.trim() || !sendEnabled" aria-label="Send thread reply">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide/sprite.svg#arrow-up"></use></svg>
        </button>
      </div>
    </form>
  </aside>
