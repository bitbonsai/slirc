name: Publish slirc-agent

# Publishes app/agent to npm when a tag like agent-v3.3.5 is pushed. Bump app/agent/package.json
# to that version first. npm trusts this workflow file through trusted publishing (OIDC), so no
# npm token is stored here: the package's npm settings must name this repo and this file.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:

concurrency:
  group: publish-agent
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "agent-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      # prepack runs bun run build, so dist matches the tagged source.
      - name: Publish
        run: npm publish
